  <!-- Site header: wordmark, page links, profile, theme, coach status -->
  <header class="sticky top-0 z-30 bg-paper border-b border-rule">
    <div class="shell h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-6 min-w-0">
        <a href="/" class="flex items-center gap-2.5 text-ink font-medium text-base tracking-tight whitespace-nowrap shrink-0">
          <span class="w-7 h-7 rounded-md bg-accent text-accent-ink flex items-center justify-center shrink-0" aria-hidden="true">
            <i data-lucide="activity" class="w-4 h-4"></i>
          </span>
          <span class="hidden sm:inline">CareCompanion</span>
        </a>

      </div>

        <nav aria-label="Pages" class="site-nav site-nav-wide">
          <a href="/demo" data-nav="demo" class="nav-link">Demo</a>
          <a href="/forecast" data-nav="forecast" class="nav-link">Forecast</a>
          <a href="/coach" data-nav="coach" class="nav-link">Coach</a>
          <a href="/checkin" data-nav="checkin" class="nav-link">Check-in</a>
          <a href="/memory" data-nav="memory" class="nav-link">Memory</a>
          <a href="/data" data-nav="data" class="nav-link">Data</a>
        </nav>

      <div class="flex items-center gap-2.5 shrink-0">
        <div class="flex items-center gap-2 bg-paper-2 border border-rule-2 rounded-md px-2.5 h-9">
          <i data-lucide="user" class="w-3.5 h-3.5 text-cool shrink-0" aria-hidden="true"></i>
          <label for="personaSelect" class="sr-only">Active athlete profile</label>
          <select id="personaSelect" class="bg-paper-2 text-xs font-medium text-ink focus:outline-none cursor-pointer max-w-[8.5rem] sm:max-w-none text-ellipsis">
            <option value="P01">Alex Rivera (Runner)</option>
            <option value="P07">Maya Lin (Tech Lead)</option>
            <option value="P12">Jordan Patel (Strength)</option>
          </select>
        </div>

        <button id="themeToggleBtn" type="button" aria-pressed="false" aria-label="Dark mode" class="inline-flex items-center gap-2 px-2.5 sm:px-3 h-9 rounded-md text-xs font-medium border border-rule-2 bg-paper-2 hover:border-accent text-ink whitespace-nowrap btn-transition">
          <i data-lucide="moon" class="w-3.5 h-3.5 sm:hidden" aria-hidden="true"></i>
          <span id="themeToggleLabel" class="hidden sm:inline">Dark mode</span>
        </button>

        <button id="openApiModalBtn" type="button" aria-label="Coach status" class="inline-flex items-center gap-2 px-2.5 sm:px-3 h-9 rounded-md text-xs font-medium border border-rule-2 bg-paper-2 hover:border-accent text-ink whitespace-nowrap btn-transition">
          <i data-lucide="bot" class="w-3.5 h-3.5 text-accent shrink-0" aria-hidden="true"></i>
          <span id="apiStatusLabel" class="hidden sm:inline">Coach status</span>
        </button>
      </div>
    </div>
        <nav aria-label="Pages (compact)" class="site-nav site-nav-narrow shell">
